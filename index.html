<!DOCTYPE html>
<!-- Datei: index.html
     Projekt: Textbausteine — Teil: App (Browser)
     Zweck: Das Gerüst der App: lädt Stil und alle Skripte in der
     richtigen Reihenfolge und stellt die leeren Flächen bereit, die
     die Ansichts-Dateien füllen. Doppelklick auf diese Datei startet
     die App.
     Testdaten-Welt: dieselbe Adresse mit ?welt=dev öffnen (roter Rahmen).
     An jeder Datei hängt eine Fassungsmarke (?v=…). Ohne sie hielte der
     Browser nach einer Veröffentlichung die alten Dateien fest, und Näd
     würde eine Fassung testen, die es nicht mehr gibt.
     GRUNDSATZ: In dieser App werden nie Patientendaten gespeichert. -->
